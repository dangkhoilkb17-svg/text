<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Message For You</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle, #201044, #050510 75%);
  color: white;
  font-family: Arial, sans-serif;
}
canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}
.content {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 24px;
  text-align: center;
  pointer-events: none;
}
h1 {
  color: #ffd6ff;
  font-size: clamp(28px, 8vw, 48px);
  text-shadow: 0 0 12px #ff4dff, 0 0 35px #a855f7;
  animation: appear 1.5s ease both;
}
#message {
  font-size: clamp(18px, 5vw, 25px);
  line-height: 1.6;
  overflow-wrap: anywhere;
  text-shadow: 0 0 12px #60a5fa;
}
@keyframes appear {
  from { opacity: 0; transform: scale(.5); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>
<body>
<canvas id="fireworks"></canvas>

<div class="content">
  <h1>✨ A Message For You ✨</h1>
  <div id="message"></div>
</div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let w, h, particles = [], rockets = [];

function resize() {
  w = canvas.width = innerWidth * devicePixelRatio;
  h = canvas.height = innerHeight * devicePixelRatio;
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
resize();
addEventListener("resize", resize);

function launch() {
  const x = Math.random() * innerWidth;
  const y = innerHeight * (0.15 + Math.random() * 0.4);
  const colors = ["#ff4dff", "#ffd700", "#00e5ff",
                  "#ff5252", "#a3ff12", "#ffffff"];
  const color = colors[Math.floor(Math.random() * colors.length)];

  for (let i = 0; i < 65; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 65 + Math.random() * 35,
      color,
      size: 1 + Math.random() * 2
    });
  }
}

let lastLaunch = 0;
function animate(time) {
  requestAnimationFrame(animate);
  ctx.fillStyle = "rgba(5, 5, 16, 0.18)";
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  if (time - lastLaunch > 550) {
    launch();
    lastLaunch = time;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.035;
    p.vx *= 0.99;
    p.life--;

    ctx.globalAlpha = Math.min(1, p.life / 25);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;
}
requestAnimationFrame(animate);

const text = "Tao có điều muốn nói với mày...";
let i = 0;
setTimeout(function type() {
  if (i < text.length) {
    document.getElementById("message").textContent += text[i++];
    setTimeout(type, 100);
  }
}, 1200);
</script>
</body>
</html>
