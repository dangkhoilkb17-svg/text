<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle, #201044, #050510 75%);
  color: white;
  font-family: Arial, sans-serif;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.content {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
  text-align: center;
  pointer-events: none;
}

#message {
  font-size: clamp(22px, 6vw, 32px);
  line-height: 1.6;
  overflow-wrap: anywhere;
  color: #fff;
  text-shadow: 0 0 8px #60a5fa;
  animation: appear 1.5s ease;
}

@keyframes appear {
  from { opacity: 0; transform: scale(.7); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>
<canvas id="fireworks"></canvas>

<div class="content">
  <div id="message"></div>
</div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let particles = [];
let w, h, dpr;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = innerWidth;
  h = innerHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resize();
addEventListener("resize", resize);

function launch() {
  const x = Math.random() * w;
  const y = h * (0.15 + Math.random() * 0.4);

  const colors = [
    "#ff4dff", "#ffd700", "#00e5ff",
    "#ff5252", "#a3ff12", "#ffffff"
  ];

  const color = colors[
    Math.floor(Math.random() * colors.length)
  ];

  for (let i = 0; i < 35; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.8 + Math.random() * 3;

    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 35 + Math.random() * 20,
      color,
      size: 0.7 + Math.random() * 1.2
    });
  }
}

let lastLaunch = 0;

function animate(time) {
  requestAnimationFrame(animate);

  ctx.fillStyle = "rgba(5, 5, 16, 0.28)";
  ctx.fillRect(0, 0, w, h);

  if (time - lastLaunch > 850) {
    launch();
    lastLaunch = time;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.025;
    p.vx *= 0.99;
    p.life--;

    ctx.globalAlpha =
      Math.min(0.35, p.life / 50) * 0.65;

    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }

  ctx.globalAlpha = 1;
}

requestAnimationFrame(animate);

const message = "Ai đã bấm vào đây là gay/les";
let i = 0;

function typeText() {
  if (i < message.length) {
    document.getElementById("message").textContent
      += message[i];
    i++;
    setTimeout(typeText, 100);
  }
}

setTimeout(typeText, 1200);
</script>
</body>
</html>
